name: JULIET AI - Android APK Build

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build JULIET AI APK
runs-on: ubuntu-24.04
timeout-minutes: 60

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  # 1. Download repository files
  - name: Checkout Repository
    uses: actions/checkout@v5

  # 2. Install Java
  - name: Set Up Java 21
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21'

  # 3. Find or install Android SDK command-line tools
  - name: Locate Android SDK Manager
    id: sdk
    shell: bash
    run: |
      set -euo pipefail

      SDKMANAGER=""

      if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
        SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
          -type f -name sdkmanager 2>/dev/null \
          | sort -V | tail -n 1 || true)"
      fi

      if [ -z "$SDKMANAGER" ]; then
        echo "Installing Android command-line tools..."

        mkdir -p "$ANDROID_HOME/cmdline-tools"
        cd "$RUNNER_TEMP"

        curl -fL --retry 3 \
          "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
          -o android-cli.zip

        mkdir -p android-cli-extracted
        unzip -q android-cli.zip -d android-cli-extracted

        mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

        cp -a android-cli-extracted/cmdline-tools/. \
          "$ANDROID_HOME/cmdline-tools/latest/"

        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      fi

      test -x "$SDKMANAGER" || chmod +x "$SDKMANAGER"

      echo "manager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
      echo "SDK Manager: $SDKMANAGER"

  # 4. Accept Android SDK licenses
  - name: Accept Android SDK Licenses
    shell: bash
    env:
      SDKMANAGER: ${{ steps.sdk.outputs.manager }}
    run: |
      set -euo pipefail

      mkdir -p "$ANDROID_HOME"

      set +o pipefail
      yes | "$SDKMANAGER" \
        --sdk_root="$ANDROID_HOME" \
        --licenses
      LICENSE_STATUS=${PIPESTATUS[1]}
      set -o pipefail

      if [ "$LICENSE_STATUS" -ne 0 ]; then
        echo "::error::Android SDK licenses could not be accepted."
        exit "$LICENSE_STATUS"
      fi

  # 5. Install Android SDK packages
  - name: Install Android SDK Packages
    shell: bash
    env:
      SDKMANAGER: ${{ steps.sdk.outputs.manager }}
    run: |
      set -euo pipefail

      "$SDKMANAGER" \
        --sdk_root="$ANDROID_HOME" \
        --install \
        "platform-tools" \
        "platforms;android-37" \
        "build-tools;36.0.0"

  # 6. Extract the Android project ZIP and find Gradle settings
  - name: Extract and Locate Android Project
    id: project
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE="$GITHUB_WORKSPACE/JulietAI-v1.9-loudspeaker-workflow-fix.zip"
      EXTRACT_DIR="$RUNNER_TEMP/juliet-extracted"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "::error::Expected ZIP file not found."
        echo "ZIP files in repository:"
        find "$GITHUB_WORKSPACE" -maxdepth 4 \
          -type f -name '*.zip' -print
        exit 1
      fi

      rm -rf "$EXTRACT_DIR"
      mkdir -p "$EXTRACT_DIR"

      echo "Checking ZIP archive..."
      unzip -t "$ZIP_FILE"

      echo "Extracting Android project..."
      unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

      echo "Searching for Gradle settings..."
      SETTINGS_FILE="$(find "$EXTRACT_DIR" \
        -type f \
        \( -name settings.gradle \
        -o -name settings.gradle.kts \) \
        -not -path '*/.gradle/*' \
        -print -quit)"

      if [ -z "$SETTINGS_FILE" ]; then
        echo "::error::No settings.gradle file found inside the ZIP."
        echo "The ZIP may not contain the Android source project."
        echo "Extracted files:"
        find "$EXTRACT_DIR" -maxdepth 6 -type f | head -200
        exit 1
      fi

      PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

      echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      echo "Android project found:"
      echo "$PROJECT_ROOT"

      echo "Project files:"
      ls -la "$PROJECT_ROOT"

  # 7. Find Gradle wrapper or prepare fallback Gradle
  - name: Prepare Gradle
    id: gradle
    shell: bash
    env:
      PROJECT_ROOT: ${{ steps.project.outputs.root }}
    run: |
      set -euo pipefail

      if [ -f "$PROJECT_ROOT/gradlew" ] && \
         [ -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then

        chmod +x "$PROJECT_ROOT/gradlew"

        echo "mode=wrapper" >> "$GITHUB_OUTPUT"
        echo "Using project Gradle wrapper."

      else
        echo "::warning::Gradle wrapper is missing; using Gradle 9.6.0."

        echo "mode=installed" >> "$GITHUB_OUTPUT"
      fi

  # 8. Build the debug APK
  - name: Build Debug APK
    id: build
    shell: bash
    env:
      PROJECT_ROOT: ${{ steps.project.outputs.root }}
      GRADLE_MODE: ${{ steps.gradle.outputs.mode }}
    run: |
      set -uo pipefail

      LOG_FILE="$RUNNER_TEMP/build.log"

      if [ "$GRADLE_MODE" = "wrapper" ]; then
        set +e

        "$PROJECT_ROOT/gradlew" \
          -p "$PROJECT_ROOT" \
          assembleDebug \
          --no-daemon \
          --stacktrace 2>&1 | tee "$LOG_FILE"

        BUILD_STATUS=${PIPESTATUS[0]}
        set -e

      else
        curl -fL --retry 3 \
          "https://services.gradle.org/distributions/gradle-9.6.0-bin.zip" \
          -o "$RUNNER_TEMP/gradle.zip"

        mkdir -p "$RUNNER_TEMP/gradle-dist"
        unzip -oq "$RUNNER_TEMP/gradle.zip" \
          -d "$RUNNER_TEMP/gradle-dist"

        GRADLE="$RUNNER_TEMP/gradle-dist/gradle-9.6.0/bin/gradle"

        set +e

        "$GRADLE" \
          -p "$PROJECT_ROOT" \
          assembleDebug \
          --no-daemon \
          --stacktrace 2>&1 | tee "$LOG_FILE"

        BUILD_STATUS=${PIPESTATUS[0]}
        set -e
      fi

      if [ "$BUILD_STATUS" -ne 0 ]; then
        echo "::error::APK build failed. See the build log artifact."
        exit "$BUILD_STATUS"
      fi

      echo "APK build completed."

  # 9. Find and upload the APK
  - name: Upload Debug APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: JULIET-AI-Debug-APK
      path: |
        ${{ runner.temp }}/juliet-extracted/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7

  # 10. Save the build log, even when the build fails
  - name: Upload Build Log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: JULIET-AI-Build-Log
      path: ${{ runner.temp }}/build.log
      if-no-files-found: ignore
      retention-days: 7
