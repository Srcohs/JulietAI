
name: JULIET AI Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juliet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JULIET AI
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          ROOT=""

          for FILE in settings.gradle.kts settings.gradle; do
            if [ -f "$FILE" ]; then
              ROOT="."
              break
            fi
          done

          if [ -z "$ROOT" ]; then
            while IFS= read -r FILE; do
              DIR="$(dirname "$FILE")"
              ROOT="$DIR"
              break
            done < <(
              find . -maxdepth 4 \
                \( -name settings.gradle -o \
                   -name settings.gradle.kts \) \
                -type f
            )
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::Gradle project settings file not found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found project at: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Check Gradle Wrapper
        id: wrapper
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
        run: |
          if [ -f "$PROJECT_ROOT/gradlew" ] && \
             [ -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x "$PROJECT_ROOT/gradlew"
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Gradle wrapper missing; using installed Gradle."
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show Build Environment
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
        run: |
          java -version
          gradle --version
          echo "Project root: $PROJECT_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build Debug APK
        id: build
        continue-on-error: true
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
          USE_WRAPPER: ${{ steps.wrapper.outputs.use_wrapper }}
        run: |
          set -o pipefail

          if [ "$USE_WRAPPER" = "true" ]; then
            "$PROJECT_ROOT/gradlew" \
              -p "$PROJECT_ROOT" \
              assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              2>&1 | tee build.log
          else
            gradle \
              -p "$PROJECT_ROOT" \
              assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              2>&1 | tee build.log
          fi

      - name: Report Build Failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Gradle build failed."
          if [ -f build.log ]; then
            tail -n 150 build.log
          fi
          exit 1

      - name: Upload Debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
